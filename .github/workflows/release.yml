name: release

# 推送 v* 标签时触发；也可手动构建尚无 Release 的已有标签，保留标签指向。
# 本地无需任何 GitHub Token —— 发布使用 Actions 自带的 GITHUB_TOKEN。
#
# Release 正文来源：仓库根目录的 CHANGELOG.md 里对应版本的段落（由下面的
# 「Extract release notes」步骤抽取）。所以**发布前必须先把 CHANGELOG.md 的
# 版本段落写好并提交**，否则会回退成一句兜底说明。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing unpublished tag to build (for example v0.1.22)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate unpublished release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Release tag must have the form vX.Y.Z.'
          }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          try {
            $null = Invoke-RestMethod -Uri $url -Headers $headers
          } catch {
            if ([int]$_.Exception.Response.StatusCode -eq 404) { exit 0 }
            throw
          }
          throw 'A Release already exists for this tag. Refusing to replace public assets.'

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Check release tag guard
        shell: pwsh
        run: ./tools/test-release-tag-check.ps1

      # package.json 是应用版本的唯一来源；标签必须与它完全一致，避免发布包、
      # About 页面和 Release 标题出现不同版本。
      - name: Verify release version
        shell: pwsh
        run: |
          $sourceVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The requested ref must be an existing tag.' }
          if ((git rev-parse HEAD) -ne $tagCommit) { throw 'Checkout differs from release tag.' }
          if ($sourceVersion -ne $tagVersion) {
            throw "Release tag v$tagVersion does not match package.json version $sourceVersion."
          }
          npm run version:check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep CI reproducible with the locally validated release compiler.
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Check Rust
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 从 CHANGELOG.md 抽当前标签对应的版本段落（到下一个 `## ` 标题为止），
      # 并以多行 heredoc 形式交给后面的 tauri-action 当作 Release 正文。
      #
      # shell: pwsh 使用 PowerShell 7；这里仍用 .NET 显式指定无 BOM 的 UTF-8，
      # 避免输出文件编码依赖 shell 默认值，确保 `$GITHUB_OUTPUT` 的首个键名没有 BOM。
      # Windows PowerShell 5.1 的兼容要求另见 publish-release.ps1，不适用于此 shell。
      #
      # 抽不到版本段落不报错，回退成一句提示，避免因为文档没跟上而卡住发布。
      - name: Extract release notes
        id: notes_body
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $lines = Get-Content -Encoding UTF8 CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+v$([regex]::Escape($version))(\s|$)") { $start = $i; break }
          }
          if ($start -lt 0) {
            Write-Host "CHANGELOG.md 里没有 v$version 的段落，使用兜底正文。"
            $notes = "CloverViewer v$version 更新。请从下方 Assets 下载 ``*-setup.exe`` 安装。"
          } else {
            $end = $lines.Count
            for ($j = $start + 1; $j -lt $lines.Count; $j++) {
              if ($lines[$j] -match '^##\s') { $end = $j; break }
            }
            $notes = ($lines[$start..($end - 1)] -join "`n").Trim()
            Write-Host "已抽取 CHANGELOG.md 中 v$version 的正文（$($end - $start) 行）。"
          }
          $delim = "RELEASE_NOTES_EOF"
          $block = "body<<$delim`r`n$notes`r`n$delim`r`n"
          [System.IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT, $block, [System.Text.UTF8Encoding]::new($false))

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri Updater 对更新包生成独立签名。私钥只存 GitHub Secrets，绝不提交。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # __VERSION__ 会被替换为触发本次构建的标签版本（如 v0.1.2 -> 0.1.2）
          tagName: v__VERSION__
          releaseName: 'CloverViewer v__VERSION__'
          releaseBody: ${{ steps.notes_body.outputs.body }}
          releaseDraft: false
          prerelease: false
