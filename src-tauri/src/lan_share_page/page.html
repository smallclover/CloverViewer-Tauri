<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>CloverViewer · 图片分享</title>
  <style>{{styles}}</style>
</head>
<body data-bytes="{{bytes}}" data-seconds="{{seconds}}" data-remaining="{{remaining}}" data-mime="{{mime}}" data-filename="{{filename}}">
  <header class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
    <span>CloverViewer <span class="brand-sub" data-text="title">图片分享</span></span>
  </header>
  <main class="share-card" id="share-card">
    <section id="file-content" aria-labelledby="filename">
      <h1 id="filename">{{filename}}</h1>
      <p class="file-meta" id="file-meta"></p>
      <a class="image-preview" id="preview-link" href="/s/{{token}}/image" target="_blank" rel="noopener" aria-label="查看大图">
        <img id="shared-image" src="/s/{{token}}/image" alt="分享的图片">
      </a>
      <div class="share-status"><span class="live-dot" aria-hidden="true"></span><span id="countdown"></span><span aria-hidden="true">·</span><span id="download-limit"></span></div>
      <div class="actions">
        <a class="button" id="view-button" href="/s/{{token}}/image" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span data-text="view">查看大图</span></a>
        <button class="button" id="share-button" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span data-text="share">分享链接</span></button>
        <a class="button primary" id="download-button" href="/s/{{token}}/download" download="{{filename}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg><span data-text="download">下载图片</span></a>
      </div>
      <section class="link-panel" id="link-panel" aria-labelledby="link-label" hidden>
        <label id="link-label" for="share-link" data-text="linkLabel">复制此链接</label>
        <div class="copy-row"><input id="share-link" type="text" readonly spellcheck="false" inputmode="url"><button class="button" id="copy-button" type="button" data-text="copy">复制</button></div>
        <p class="hint" data-text="linkHint">可粘贴到微信等应用；接收方需连接同一局域网。</p>
      </section>
      <p class="hint wechat-hint" id="wechat-hint" data-text="wechatHint" hidden>微信内若无法下载，请用右上角菜单在浏览器中打开。</p>
    </section>
    <section class="unavailable" id="unavailable" aria-labelledby="state-title" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18m-12-8-2 2a4 4 0 0 0 6 6l2-2m-3-9 2-2a4 4 0 0 1 6 6l-1 1"/></svg>
      <h1 id="state-title"></h1><p class="hint" id="state-hint"></p>
      <button class="button" id="retry-button" type="button" data-text="retry" hidden>重试</button>
    </section>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
  </main>
  <footer><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0m-11 4a6 6 0 0 1 8 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg><span data-text="footer">由同一局域网内的设备分享</span></footer>
  <script id="translations" type="application/json">{"zh-CN":{{zh}},"en":{{en}},"ja":{{ja}}}</script>
  <script>{{script}}</script>
</body>
</html>
