<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot</title>
    <style>
      /* 初始化前隐藏：避免 CSS/JS 未就绪时 HTML 骨架裸渲染（元素挤在左上角）。
         loadScreenshot() 完成后由 JS 加 .ready 显示。 */
      body {
        opacity: 0;
      }
      body.ready {
        opacity: 1;
        transition: opacity 60ms linear;
      }
      /* 透明窗口要求 html/body 全部透明，否则 Windows 上 wry 会渲染白底 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: crosshair;
      }
      #screenshot-root {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #screenshot-root img {
        position: absolute;
        pointer-events: none;
        -webkit-user-drag: none;
      }
      #overlay-canvas {
        position: absolute;
        left: 0;
        top: 0;
        /* canvas 是 replaced element：absolute + inset:0 不会拉伸它，
           会用 attribute（物理像素）当 CSS 尺寸 → dpr≠1 时 canvas 比 viewport
           大 dpr 倍，绘制与鼠标错位。必须显式 width/height 100%。 */
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      /* UI 层默认不拦截鼠标，具体控件自行开启 pointer-events */
      #ui-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .ui-interactive {
        pointer-events: auto;
      }

      /* ============ 浮动工具栏（玻璃拟态 · 暗色） ============ */
      .toolbar {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px;
        background: rgba(28, 30, 36, 0.72);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }
      .toolbar button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: none;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
        color: #e6e6ea;
        transition: background 0.14s ease, color 0.14s ease, transform 0.08s ease, box-shadow 0.14s ease;
      }
      .toolbar button:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }
      .toolbar button:active {
        transform: scale(0.9);
      }
      .toolbar button.active {
        background: #4ea85c;
        color: #fff;
        box-shadow: 0 2px 8px rgba(78, 168, 92, 0.5);
      }
      .toolbar button svg {
        width: 20px;
        height: 20px;
      }
      .toolbar .divider {
        width: 1px;
        height: 20px;
        margin: 0 4px;
        background: rgba(255, 255, 255, 0.14);
      }
      .toolbar .swatch {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-sizing: border-box;
      }
      .toolbar .width-dot {
        border-radius: 50%;
        background: #e6e6ea;
      }

      /* ============ 弹出面板（玻璃拟态 · 暗色） ============ */
      .popup {
        position: absolute;
        background: rgba(28, 30, 36, 0.92);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        padding: 8px;
        display: none;
        color: #e6e6ea;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }
      .popup.open {
        display: block;
      }
      .palette {
        display: grid;
        grid-template-columns: repeat(5, 22px);
        gap: 6px;
      }
      .palette .cell {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
        box-sizing: border-box;
        transition: transform 0.1s ease;
      }
      .palette .cell:hover {
        transform: scale(1.12);
      }
      .palette .cell.sel {
        outline: 2px solid #6fd07e;
        outline-offset: 1px;
      }
      .palette .native {
        grid-column: 1 / -1;
        width: 100%;
        height: 24px;
        border: none;
        padding: 0;
        background: none;
        color: #cfd1d8;
        cursor: pointer;
      }
      .width-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .width-list .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .width-list .row:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .width-list .row .bar {
        height: 4px;
        border-radius: 2px;
        background: #e6e6ea;
      }

      /* ============ 文本输入 ============ */
      #text-input {
        position: absolute;
        min-width: 60px;
        min-height: 28px;
        background: transparent;
        border: 1px dashed #6fd07e;
        outline: none;
        resize: none;
        overflow: hidden;
        color: #fff;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        line-height: 1.2;
        padding: 0;
        caret-color: #6fd07e;
        display: none;
        pointer-events: auto;
      }
      #text-input.editing {
        display: block;
      }

      /* ============ 帮助框 ============ */
      #help-box {
        position: absolute;
        left: 12px;
        bottom: 12px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 12px;
        line-height: 1.7;
        padding: 8px 12px;
        border-radius: 6px;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        white-space: pre;
      }

      /* ============ OCR 结果面板 ============ */
      #ocr-panel {
        position: absolute;
        display: flex;
        flex-direction: column;
        background: rgba(28, 30, 36, 0.94);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        color: #e6e6ea;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }
      #ocr-panel .ocr-header {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 6px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
      }
      #ocr-panel .ocr-title {
        flex: 1;
        font-size: 12px;
        font-weight: 600;
        color: #cfd1d8;
        padding-left: 2px;
      }
      #ocr-panel .ocr-header button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        padding: 0;
        border: none;
        border-radius: 5px;
        background: transparent;
        cursor: pointer;
        color: #e6e6ea;
        transition: background 0.12s ease;
      }
      #ocr-panel .ocr-header button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      #ocr-panel .ocr-header button svg {
        width: 17px;
        height: 17px;
      }
      #ocr-panel .ocr-body {
        flex: 1;
        overflow: auto;
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.6;
        color: #e6e6ea;
        white-space: pre-wrap;
        word-break: break-all;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }
      #ocr-panel .ocr-body.error {
        color: #ff8a8a;
      }
    </style>
  </head>
  <body>
    <div id="screenshot-root">
      <canvas id="overlay-canvas"></canvas>
      <div id="ui-layer"></div>
    </div>
    <script type="module" src="/src/screenshot.ts"></script>
  </body>
</html>
