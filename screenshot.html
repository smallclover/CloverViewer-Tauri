<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot</title>
    <style>
      /* 截图窗口 UI 主题变量 —— 跟随应用设置里的主题（config.theme），
         由 screenshot.ts 读到后写入 <html data-theme> 切换。默认暗色。 */
      :root {
        --s-toolbar-bg: rgba(28, 30, 36, 0.72);
        --s-toolbar-border: rgba(255, 255, 255, 0.12);
        --s-fg: #e6e6ea;
        --s-fg-dim: #9a9ca6;
        --s-btn-hover-bg: rgba(255, 255, 255, 0.12);
        --s-btn-hover-fg: #ffffff;
        --s-accent: #4ea85c;
        --s-accent-shadow: rgba(78, 168, 92, 0.5);
        --s-popup-bg: rgba(28, 30, 36, 0.92);
        --s-popup-border: rgba(255, 255, 255, 0.12);
        --s-row-hover-bg: rgba(255, 255, 255, 0.1);
        --s-divider: rgba(255, 255, 255, 0.14);
        --s-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        --s-border-soft: rgba(255, 255, 255, 0.35);
        --s-help-bg: rgba(0, 0, 0, 0.55);
        --s-kbd-bg: rgba(255, 255, 255, 0.14);
        --s-kbd-border: rgba(255, 255, 255, 0.2);
        --s-panel-bg: rgba(28, 30, 36, 0.94);
        --s-panel-header-bg: rgba(255, 255, 255, 0.05);
        --s-panel-title: #cfd1d8;
        --s-error: #ff8a8a;
      }
      :root[data-theme="light"] {
        --s-toolbar-bg: rgba(255, 255, 255, 0.82);
        --s-toolbar-border: rgba(0, 0, 0, 0.14);
        --s-fg: #26272d;
        --s-fg-dim: #6e707a;
        --s-btn-hover-bg: rgba(0, 0, 0, 0.08);
        --s-btn-hover-fg: #111111;
        --s-accent: #3d8a49;
        --s-accent-shadow: rgba(61, 138, 73, 0.4);
        --s-popup-bg: rgba(255, 255, 255, 0.96);
        --s-popup-border: rgba(0, 0, 0, 0.14);
        --s-row-hover-bg: rgba(0, 0, 0, 0.07);
        --s-divider: rgba(0, 0, 0, 0.15);
        --s-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        --s-border-soft: rgba(0, 0, 0, 0.3);
        --s-help-bg: rgba(255, 255, 255, 0.86);
        --s-kbd-bg: rgba(0, 0, 0, 0.07);
        --s-kbd-border: rgba(0, 0, 0, 0.18);
        --s-panel-bg: rgba(255, 255, 255, 0.97);
        --s-panel-header-bg: rgba(0, 0, 0, 0.04);
        --s-panel-title: #6e707a;
        --s-error: #d64545;
      }

      /* 初始化前隐藏：避免 CSS/JS 未就绪时 HTML 骨架裸渲染（元素挤在左上角）。
         loadScreenshot() 完成后由 JS 加 .ready 显示。 */
      body {
        opacity: 0;
      }
      body.ready {
        opacity: 1;
        transition: opacity 60ms linear;
      }
      /* 透明窗口要求 html/body 全部透明，否则 Windows 上 wry 会渲染白底 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: crosshair;
      }
      #screenshot-root {
        position: fixed;
        inset: 0;
        overflow: hidden;
        /* 不透明深色铺底：多屏高度不同时，较矮屏那一列下方是"无屏幕"空白，
           若保持透明会透出活桌面，看起来像没截到。铺一层深色后，空白/边缘
           细缝都统一显示为深色，不再露馅。 */
        background: #14161c;
      }
      /* 只作用于**直接子** img（标注图层用到的位图）。子选择器是必须的：
         滚动截图的结果缩略预览是 #scroll-hud 里的 <img>，若这里写成后代选择器，
         ID 选择器的权重会压过 `.sh-preview`，把预览变成 absolute 而与按钮叠在一起。 */
      #screenshot-root > img {
        position: absolute;
        pointer-events: none;
        -webkit-user-drag: none;
      }
      #overlay-canvas {
        position: absolute;
        left: 0;
        top: 0;
        /* canvas 是 replaced element：absolute + inset:0 不会拉伸它，
           会用 attribute（物理像素）当 CSS 尺寸 → dpr≠1 时 canvas 比 viewport
           大 dpr 倍，绘制与鼠标错位。必须显式 width/height 100%。 */
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      /* UI 层默认不拦截鼠标，具体控件自行开启 pointer-events */
      #ui-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .ui-interactive {
        pointer-events: auto;
      }

      /* ============ 浮动工具栏（玻璃拟态 · 暗色） ============ */
      .toolbar {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px;
        background: var(--s-toolbar-bg);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid var(--s-toolbar-border);
        border-radius: 12px;
        box-shadow: var(--s-shadow);
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }
      .toolbar button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: none;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
        color: var(--s-fg);
        transition: background 0.14s ease, color 0.14s ease, transform 0.08s ease, box-shadow 0.14s ease;
      }
      .toolbar button:hover {
        background: var(--s-btn-hover-bg);
        color: var(--s-btn-hover-fg);
      }
      .toolbar button:active {
        transform: scale(0.9);
      }
      .toolbar button.active {
        background: var(--s-accent);
        color: #fff;
        box-shadow: 0 2px 8px var(--s-accent-shadow);
      }
      .toolbar button svg {
        width: 20px;
        height: 20px;
      }
      .toolbar .divider {
        width: 1px;
        height: 20px;
        margin: 0 4px;
        background: var(--s-divider);
      }
      .toolbar .swatch {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        border: 1px solid var(--s-border-soft);
        box-sizing: border-box;
      }
      .toolbar .width-dot {
        border-radius: 50%;
        background: var(--s-fg);
      }

      /* ============ 弹出面板（玻璃拟态 · 暗色） ============ */
      .popup {
        position: absolute;
        background: var(--s-popup-bg);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid var(--s-popup-border);
        border-radius: 10px;
        box-shadow: var(--s-shadow);
        padding: 8px;
        display: none;
        color: var(--s-fg);
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }
      .popup.open {
        display: block;
      }
      .palette {
        display: grid;
        grid-template-columns: repeat(5, 22px);
        gap: 6px;
      }
      .palette .cell {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        border: 1px solid var(--s-border-soft);
        cursor: pointer;
        box-sizing: border-box;
        transition: transform 0.1s ease;
      }
      .palette .cell:hover {
        transform: scale(1.12);
      }
      .palette .cell.sel {
        outline: 2px solid #6fd07e;
        outline-offset: 1px;
      }
      .palette .native {
        grid-column: 1 / -1;
        width: 100%;
        height: 24px;
        border: none;
        padding: 0;
        background: none;
        color: var(--s-panel-title);
        cursor: pointer;
      }
      .width-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .width-list .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .width-list .row:hover {
        background: var(--s-row-hover-bg);
      }
      .width-list .row .bar {
        height: 4px;
        border-radius: 2px;
        background: var(--s-fg);
      }

      /* ============ 文本输入 ============ */
      #text-input {
        position: absolute;
        min-width: 60px;
        min-height: 28px;
        background: transparent;
        border: 1px dashed #6fd07e;
        outline: none;
        resize: none;
        overflow: hidden;
        color: var(--s-fg);
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        line-height: 1.2;
        padding: 0;
        caret-color: #6fd07e;
        display: none;
        pointer-events: auto;
      }
      #text-input.editing {
        display: block;
      }

      /* ============ 帮助框（快捷键提示） ============
         每项一行「键帽 + 说明」，用两列网格排布（列优先，先填满 4 行再换列），
         键帽等宽、说明左对齐 —— 比原先的三行「·」串排整齐、也便于按行扫读。
         由 screenshot.ts 的 HELP_ITEMS 生成 DOM，文案走 i18n。 */
      #help-box {
        position: absolute;
        left: 12px;
        bottom: 12px;
        display: grid;
        grid-auto-flow: column;
        grid-template-rows: repeat(4, auto);
        gap: 2px 16px;
        padding: 7px 11px;
        background: var(--s-help-bg);
        backdrop-filter: blur(10px) saturate(150%);
        -webkit-backdrop-filter: blur(10px) saturate(150%);
        border: 1px solid var(--s-toolbar-border);
        border-radius: 8px;
        color: var(--s-fg-dim);
        font-size: 12px;
        line-height: 1.35;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        white-space: nowrap;
        /* 工具栏落到左下角时由 render() 抬高避让，用 transform 不触发重排 */
        transition: transform 0.12s ease;
      }
      #help-box .hint {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #help-box kbd {
        flex: none;
        box-sizing: border-box;
        min-width: 46px;
        padding: 1px 6px;
        border: 1px solid var(--s-kbd-border);
        border-radius: 4px;
        background: var(--s-kbd-bg);
        color: var(--s-fg);
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.5;
        text-align: center;
      }

      /* ============ OCR 结果面板 ============ */
      #ocr-panel {
        position: absolute;
        display: flex;
        flex-direction: column;
        background: var(--s-panel-bg);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid var(--s-popup-border);
        border-radius: 10px;
        box-shadow: var(--s-shadow);
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        color: var(--s-fg);
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }
      #ocr-panel .ocr-header {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 6px 8px;
        border-bottom: 1px solid var(--s-toolbar-border);
        background: var(--s-panel-header-bg);
      }
      #ocr-panel .ocr-title {
        flex: 1;
        font-size: 12px;
        font-weight: 600;
        color: var(--s-panel-title);
        padding-left: 2px;
      }
      #ocr-panel .ocr-header button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        padding: 0;
        border: none;
        border-radius: 5px;
        background: transparent;
        cursor: pointer;
        color: var(--s-fg);
        transition: background 0.12s ease;
      }
      #ocr-panel .ocr-header button:hover {
        background: var(--s-btn-hover-bg);
      }
      #ocr-panel .ocr-header button svg {
        width: 17px;
        height: 17px;
      }
      #ocr-panel .ocr-body {
        flex: 1;
        overflow: auto;
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--s-fg);
        white-space: pre-wrap;
        word-break: break-all;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }
      #ocr-panel .ocr-body.error {
        color: var(--s-error);
      }
      /* ============ 滚动截图：开始面板 / 进度与结果 HUD ============
         两者都定位在**选区之外**：捕获期间选区内的画布必须保持全透明
         （透出真实窗口，屏幕像素捕获才不会把 UI 画进长图里）。 */
      #scroll-panel,
      #scroll-hud {
        position: absolute;
        display: none;
        flex-direction: column;
        gap: 7px;
        box-sizing: border-box;
        width: min(320px, calc(100vw - 20px));
        padding: 11px 12px;
        background: var(--s-panel-bg);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid var(--s-popup-border);
        border-radius: 10px;
        box-shadow: var(--s-shadow);
        color: var(--s-fg);
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        font-size: 12px;
        line-height: 1.5;
      }
      #scroll-hud {
        width: min(280px, calc(100vw - 20px));
      }
      #scroll-panel.open,
      #scroll-hud.open {
        display: flex;
      }
      /* 后端采帧的瞬间：HUD 压在捕获区上时必须让开（否则可能被截进长图），
         抓完立刻恢复 —— 每帧只隐藏 ~120ms。 */
      #scroll-hud.hud-hidden {
        visibility: hidden;
      }
      .sh-title {
        font-weight: 600;
        color: var(--s-panel-title);
        font-size: 13px;
        line-height: 1.25;
      }
      .sh-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .sh-badge {
        flex: 0 0 auto;
        padding: 2px 6px;
        border: 1px solid var(--s-toolbar-border);
        border-radius: 999px;
        color: var(--s-fg-dim);
        font-size: 10px;
        line-height: 1.35;
        white-space: nowrap;
      }
      .sh-badge.ok { color: var(--s-accent); }
      .sh-badge.warn { color: #d8a13a; }
      .sh-badge.recording { color: #e46467; }
      .sh-metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .sh-metric {
        min-width: 0;
        padding: 6px 7px;
        border: 1px solid var(--s-toolbar-border);
        border-radius: 7px;
        background: color-mix(in srgb, var(--s-panel-bg) 84%, #000 16%);
      }
      .sh-metric-label {
        overflow: hidden;
        color: var(--s-fg-dim);
        font-size: 10px;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sh-metric-value {
        overflow: hidden;
        margin-top: 2px;
        color: var(--s-panel-title);
        font-size: 12px;
        font-weight: 600;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sh-status {
        color: var(--s-fg-dim);
      }
      .sh-detail {
        display: none;
        color: var(--s-fg-dim);
        font-size: 11px;
        line-height: 1.42;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .sh-detail.on { display: -webkit-box; }
      .sh-detail.warn { color: #d8a13a; }
      .sh-status.warn {
        color: #d8a13a;
      }
      .sh-status.err {
        color: var(--s-error);
      }
      /* SendInput 注入期间覆盖窗整体放行鼠标（滚轮要落到底下的目标窗口），
         此时 HUD 上的按钮点不到 —— 必须显式禁用命中测试，否则用户点「停止」
         只会把点击穿透给目标应用，看起来像按钮坏了（唯一出口是 Esc）。 */
      #scroll-hud.clickthrough {
        pointer-events: none;
      }
      .sh-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .sh-actions.result { padding-top: 2px; }
      .sh-actions.result .sh-btn.primary { order: -1; }
      .sh-actions-footer {
        display: none;
        justify-content: space-between;
        width: 100%;
        padding-top: 3px;
        border-top: 1px solid var(--s-toolbar-border);
      }
      .sh-actions-footer.result { display: flex; }
      .sh-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 10px;
        border: 1px solid var(--s-toolbar-border);
        border-radius: 6px;
        background: transparent;
        color: var(--s-fg);
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .sh-btn:hover:not(:disabled) {
        background: var(--s-btn-hover-bg);
      }
      .sh-btn.primary {
        background: var(--s-accent);
        border-color: transparent;
        color: #fff;
      }
      .sh-btn.quiet {
        padding-inline: 2px;
        border-color: transparent;
        color: var(--s-fg-dim);
      }
      .sh-btn.quiet:hover:not(:disabled) {
        background: transparent;
        color: var(--s-fg);
      }
      .sh-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .sh-preview {
        display: none;
        width: 120px;
        max-height: 220px;
        object-fit: contain;
        align-self: flex-start;
        border: 1px solid var(--s-toolbar-border);
        border-radius: 4px;
        background: #000;
        image-rendering: auto;
      }
      .sh-preview.on {
        display: block;
      }
      /* 开始面板里的「从页面顶部开始」勾选项 */
      /* REC 手感：捕获中标题前一个呼吸红点，扫一眼就知道「正在录」 */
      .sh-rec {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border-radius: 50%;
        background: #ff4d4f;
        box-shadow: 0 0 6px rgba(255, 77, 79, 0.9);
        animation: sh-rec-pulse 1.1s ease-in-out infinite;
        vertical-align: middle;
      }
      @keyframes sh-rec-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.82); }
      }
      .sh-check {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--s-fg-dim);
        cursor: pointer;
        user-select: none;
      }
      .sh-esc-stop {
        display: none;
        color: var(--s-fg-dim);
        font-size: 11px;
      }
      .sh-esc-stop.on { display: block; }
      /* 覆盖窗里的一次性提示（成功 / 失败）。截图窗没有主窗口那套 toast，
         而结果态的失败原因必须有地方显示 —— 否则「保存失败」是一次无声的点击。 */
      #scroll-notice {
        position: absolute;
        display: none;
        max-width: min(420px, calc(100vw - 32px));
        padding: 9px 12px;
        border: 1px solid var(--s-popup-border);
        border-radius: 8px;
        background: var(--s-panel-bg);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        box-shadow: var(--s-shadow);
        color: var(--s-fg);
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        font-size: 12px;
        line-height: 1.45;
        word-break: break-all;
      }
      #scroll-notice.on { display: block; }
      #scroll-notice.err { color: var(--s-error); border-color: var(--s-error); }
      .sh-check input {
        margin: 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="screenshot-root">
      <canvas id="overlay-canvas"></canvas>
      <div id="ui-layer"></div>
    </div>
    <script type="module" src="/src/screenshot.ts"></script>
  </body>
</html>
