<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloverViewer</title>
  </head>
  <body>
    <div id="app">
      <div id="titlebar">
        <span class="titlebar-title"><img class="tb-logo" src="/logo.png" alt="CloverViewer" /> CloverViewer</span>
        <div class="titlebar-spacer"></div>
        <div class="titlebar-controls">
          <button id="win-min" class="titlebar-btn" data-i18n-title="win.min" title="最小化">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </button>
          <button id="win-close" class="titlebar-btn" data-i18n-title="win.close" title="关闭">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>

      <header id="toolbar">
        <button id="btn-open" class="tb-btn primary" data-i18n-title="toolbar.openTitle">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span data-i18n="toolbar.open">打开文件夹</span>
        </button>
        <nav id="breadcrumb" class="breadcrumb"></nav>
        <div class="spacer"></div>
        <button id="btn-rotate" class="tb-btn hidden" data-i18n-title="toolbar.rotate">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><polyline points="21 3 21 8 16 8"/></svg>
        </button>
        <button id="btn-flip-h" class="tb-btn hidden" data-i18n-title="toolbar.flipH">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 5 5-5 5V7"/><path d="m21 7-5 5 5 5V7"/><path d="M12 20v2"/><path d="M12 14v2"/><path d="M12 8v2"/><path d="M12 2v2"/></svg>
        </button>
        <button id="btn-flip-v" class="tb-btn hidden" data-i18n-title="toolbar.flipV">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 3-5 5-5-5h10"/><path d="m17 21-5-5-5 5h10"/><path d="M4 12H2"/><path d="M10 12H8"/><path d="M16 12h-2"/><path d="M22 12h-2"/></svg>
        </button>
        <button id="btn-props" class="tb-btn hidden" data-i18n-title="toolbar.propsTitle">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
          <span data-i18n="toolbar.props">属性</span>
        </button>
        <button id="btn-settings" class="tb-btn" data-i18n-title="toolbar.settings">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </header>

      <main id="content">
        <div id="empty-state">
          <div class="empty-icon"><img src="/logo.png" alt="CloverViewer" /></div>
          <p data-i18n="empty.title">尚未打开文件夹</p>
          <p class="hint" data-i18n="empty.hint">点击「打开文件夹」或拖入图片 / Ctrl+O</p>
        </div>

        <div id="grid-view" class="hidden">
          <div id="grid">
            <div id="grid-spacer"></div>
          </div>
        </div>

        <div id="single-view" class="hidden">
          <div id="img-stage">
            <img id="single-img" alt="" draggable="false" />
            <button id="nav-prev" class="nav-btn" title="上一张" data-i18n-title="nav.prev" aria-label="上一张">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button id="nav-next" class="nav-btn" title="下一张" data-i18n-title="nav.next" aria-label="下一张">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
          <aside id="props-panel">
            <h3 data-i18n="props.title">属性</h3>
            <div id="props-list"></div>
          </aside>
        </div>
      </main>

      <footer id="statusbar">
        <span id="status-left" data-i18n="status.ready">就绪</span>
        <div id="status-group">
          <span id="status-right"></span>
          <div id="view-switch">
            <button id="btn-grid" class="vs-btn active" data-i18n-title="view.gridTitle">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              <span data-i18n="view.grid">网格</span>
            </button>
            <button id="btn-single" class="vs-btn" data-i18n-title="view.singleTitle">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
              <span data-i18n="view.single">单图</span>
            </button>
          </div>
        </div>
      </footer>

      <div id="context-menu" class="hidden"></div>
      <div id="drop-overlay" class="hidden" data-i18n="drop.open">松开以打开</div>
      <div id="toast" class="hidden"></div>

      <div id="settings-overlay" class="hidden">
        <div id="settings-panel" role="dialog" aria-modal="true">
          <header class="settings-header">
            <h2 data-i18n="settings.title">设置</h2>
            <button id="settings-close" class="settings-close" data-i18n-title="settings.close">✕</button>
          </header>
          <div class="settings-body">
            <div class="setting-row">
              <label for="set-language" data-i18n="settings.language">语言 / Language</label>
              <select id="set-language">
                <option value="Zh" data-i18n="settings.language.zh">简体中文</option>
                <option value="En" data-i18n="settings.language.en">English</option>
                <option value="Ja" data-i18n="settings.language.ja">日本語</option>
              </select>
            </div>
            <div class="setting-row">
              <label for="set-theme" data-i18n="settings.theme">主题</label>
              <select id="set-theme">
                <option value="system" data-i18n="settings.theme.system">跟随系统</option>
                <option value="dark" data-i18n="settings.theme.dark">深色</option>
                <option value="light" data-i18n="settings.theme.light">浅色</option>
              </select>
            </div>
            <div class="setting-row">
              <label for="set-zoom"><span data-i18n="settings.zoom">缩放灵敏度</span> <span class="hint" id="set-zoom-val"></span></label>
              <input id="set-zoom" type="range" min="0.3" max="3" step="0.1" />
            </div>
            <div class="setting-row">
              <label for="set-hotkey" data-i18n="settings.hotkey">截图热键</label>
              <div class="hotkey-row">
                <input id="set-hotkey" type="text" spellcheck="false" placeholder="Alt+S" />
                <button id="set-hotkey-apply" class="mini-btn" data-i18n="settings.apply">应用</button>
              </div>
            </div>
            <div class="setting-row">
              <label for="set-color-hotkey" data-i18n="settings.colorHotkey">取色热键</label>
              <div class="hotkey-row">
                <input id="set-color-hotkey" type="text" spellcheck="false" placeholder="Alt+C" />
                <button id="set-color-hotkey-apply" class="mini-btn" data-i18n="settings.apply">应用</button>
              </div>
            </div>
            <div class="setting-row toggle">
              <span data-i18n="settings.magnifier">截图放大镜</span>
              <input id="set-magnifier" type="checkbox" />
            </div>
            <div class="setting-row toggle">
              <span data-i18n="settings.minimize">关闭时最小化到托盘</span>
              <input id="set-minimize" type="checkbox" />
            </div>
            <div class="setting-row toggle">
              <span data-i18n="settings.autostart">开机自启</span>
              <input id="set-autostart" type="checkbox" />
            </div>
          </div>
        </div>
      </div>

      <!-- 无边框窗口边缘缩放把手（frameless 下原生边框缩放失效，用 startResizeDragging 补回） -->
      <div class="resize-handle rh-s" data-dir="South"></div>
      <div class="resize-handle rh-e" data-dir="East"></div>
      <div class="resize-handle rh-w" data-dir="West"></div>
      <div class="resize-handle rh-se" data-dir="SouthEast"></div>
      <div class="resize-handle rh-sw" data-dir="SouthWest"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
