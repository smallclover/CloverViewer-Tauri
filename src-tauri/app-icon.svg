<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#128a4a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f4fff9"/>
      <stop offset="1" stop-color="#d9f7e6"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- 四叶草：四片心形叶子，尖端指向中心 -->
  <g transform="translate(512,512) scale(3.1)">
    <path d="M0 0 C -30 -28 -50 -48 -50 -70 A 18 18 0 0 1 -32 -88 C -24 -88 -20 -85 -16 -80 L 0 -62 L 16 -80 C 20 -85 24 -88 32 -88 A 18 18 0 0 1 50 -70 C 50 -48 30 -28 0 0 Z"
          fill="url(#leaf)" stroke="#ffffff" stroke-width="3"/>
    <path d="M0 0 C -30 -28 -50 -48 -50 -70 A 18 18 0 0 1 -32 -88 C -24 -88 -20 -85 -16 -80 L 0 -62 L 16 -80 C 20 -85 24 -88 32 -88 A 18 18 0 0 1 50 -70 C 50 -48 30 -28 0 0 Z"
          fill="url(#leaf)" stroke="#ffffff" stroke-width="3" transform="rotate(90)"/>
    <path d="M0 0 C -30 -28 -50 -48 -50 -70 A 18 18 0 0 1 -32 -88 C -24 -88 -20 -85 -16 -80 L 0 -62 L 16 -80 C 20 -85 24 -88 32 -88 A 18 18 0 0 1 50 -70 C 50 -48 30 -28 0 0 Z"
          fill="url(#leaf)" stroke="#ffffff" stroke-width="3" transform="rotate(180)"/>
    <path d="M0 0 C -30 -28 -50 -48 -50 -70 A 18 18 0 0 1 -32 -88 C -24 -88 -20 -85 -16 -80 L 0 -62 L 16 -80 C 20 -85 24 -88 32 -88 A 18 18 0 0 1 50 -70 C 50 -48 30 -28 0 0 Z"
          fill="url(#leaf)" stroke="#ffffff" stroke-width="3" transform="rotate(270)"/>
  </g>

  <!-- 中心圆点 -->
  <circle cx="512" cy="512" r="26" fill="#128a4a"/>
  <circle cx="512" cy="512" r="14" fill="#3ddc84"/>
</svg>
